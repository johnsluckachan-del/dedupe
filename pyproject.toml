[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupe"
version = "0.1.0"
description = "CLI to delete duplicate files and folders with fuzzy-name matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# The similar pass (near-duplicate images and documents) works without these;
# images need Pillow and PDF text needs pypdf, and each is skipped with one
# stderr warning when it is missing. Everything else is stdlib.
[project.optional-dependencies]
similar = [
    "Pillow",
    "pypdf",
]

[project.scripts]
dedupe = "dedupe.cli:main"
